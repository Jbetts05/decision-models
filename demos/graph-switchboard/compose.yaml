name: decision-models

services:
  age:
    image: apache/age:release_PG16_1.6.0
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: traversal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - traversal-age:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traversal"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  traversal-age:
