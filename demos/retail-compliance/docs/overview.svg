<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Shelf Check overview</title>
  <desc id="d">A coffee-bay visit's photos go to Microsoft-Decision-1.1 with the checks for both live campaigns in one request. Brightmoor Summer Saver fails on a wrong price label; Hollin 2 for £7 goes to review because the top-shelf close-up is missing; the Hazelnut launch is not live, so it is not asked. Checks are extracted once per campaign by GPT-6 Sol and reviewed by a person.</desc>
  <style>
    .bg { fill: #f7f4ef; }
    .card { fill: #fff; stroke: #dedede; }
    .soft { fill: #fcfbf8; stroke: #dedede; }
    .t { font: 600 15px 'Segoe UI', Aptos, sans-serif; fill: #242424; }
    .s { font: 12px 'Segoe UI', Aptos, sans-serif; fill: #5c5c5c; }
    .e { font: 650 10px 'Segoe UI', Aptos, sans-serif; letter-spacing: 1.5px; fill: #6f6f6f; }
    .ea { font: 650 10px 'Segoe UI', Aptos, sans-serif; letter-spacing: 1.5px; fill: #b11f4b; }
    .m { font: 12px Consolas, 'Courier New', monospace; fill: #5c5c5c; }
    .badge { font: 600 11px Consolas, 'Courier New', monospace; letter-spacing: 1px; }
    .line { stroke: #c9c4bd; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .flow { fill: #b11f4b; }
    .p1 { animation: travel 8s ease-in-out infinite; }
    .p2 { animation: travel 8s ease-in-out .15s infinite; }
    .p3 { animation: travel 8s ease-in-out .3s infinite; }
    @keyframes travel { 0%, 8% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 32% { transform: translateX(150px); opacity: 1; } 36%, 100% { transform: translateX(150px); opacity: 0; } }
    .out { animation: out 8s ease-in-out infinite; }
    @keyframes out { 0%, 40% { transform: translateX(0); opacity: 0; } 44% { opacity: 1; } 58% { transform: translateX(118px); opacity: 1; } 62%, 100% { transform: translateX(118px); opacity: 0; } }
    .v1 { animation: show 8s infinite; } .v2 { animation: show2 8s infinite; } .v3 { animation: show3 8s infinite; }
    @keyframes show { 0%, 58% { opacity: 0; } 62%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show2 { 0%, 63% { opacity: 0; } 67%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show3 { 0%, 68% { opacity: 0; } 72%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .pulse { animation: pulse 8s infinite; transform-origin: 480px 190px; }
    @keyframes pulse { 0%, 34% { stroke: #dedede; } 38%, 56% { stroke: #b11f4b; } 60%, 100% { stroke: #dedede; } }
    @media (prefers-reduced-motion: reduce) { .p1, .p2, .p3, .out { animation: none; opacity: 0; } .v1, .v2, .v3 { animation: none; opacity: 1; } .pulse { animation: none; } }
  </style>
  <rect class="bg" width="960" height="420" rx="18"/>

  <text class="ea" x="32" y="42">STORE VISIT</text>
  <rect class="card" x="32" y="58" width="220" height="252" rx="14"/>
  <rect x="48" y="74" width="188" height="92" rx="8" fill="#e9e4dc"/>
  <g fill="#b11f4b" opacity=".85"><rect x="60" y="84" width="22" height="30" rx="2"/><rect x="86" y="84" width="22" height="30" rx="2"/><rect x="112" y="84" width="22" height="30" rx="2"/></g>
  <g fill="#1f4e9c" opacity=".85"><rect x="60" y="124" width="22" height="30" rx="2"/><rect x="86" y="124" width="22" height="30" rx="2"/></g>
  <g fill="#242424" opacity=".8"><rect x="112" y="124" width="22" height="30" rx="2"/><rect x="138" y="124" width="22" height="30" rx="2"/></g>
  <g fill="#2e7d4f" opacity=".85"><rect x="164" y="124" width="22" height="30" rx="2"/><rect x="190" y="124" width="22" height="30" rx="2"/></g>
  <text class="e" x="48" y="184">BAY</text>
  <rect x="48" y="196" width="90" height="56" rx="8" fill="#e9e4dc"/><rect x="58" y="222" width="30" height="12" rx="2" fill="#ffffff"/>
  <rect x="146" y="196" width="90" height="56" rx="8" fill="none" stroke="#c9c4bd" stroke-width="1.5" stroke-dasharray="4 4"/><text class="s" x="168" y="229">missing</text>
  <text class="e" x="48" y="270">MID</text><text class="e" x="146" y="270">TOP</text>
  <text class="s" x="48" y="294">2 to 4 photos per visit</text>

  <path class="line" d="M256 184 H 404"/>
  <circle class="flow p1" cx="262" cy="184" r="5"/><circle class="flow p2" cx="262" cy="184" r="5"/><circle class="flow p3" cx="262" cy="184" r="5"/>

  <rect class="card pulse" x="408" y="120" width="176" height="132" rx="14" stroke-width="2"/>
  <text class="ea" x="426" y="148">ONE REQUEST</text>
  <text class="t" x="426" y="174">Decision-1.1</text>
  <text class="m" x="426" y="200">18 checks asked</text>
  <text class="m" x="426" y="220">2 live campaigns</text>
  <text class="s" x="426" y="240">3 not asked: no photo</text>

  <rect class="soft" x="408" y="300" width="176" height="80" rx="12"/>
  <text class="e" x="424" y="324">ONCE PER CAMPAIGN</text>
  <text class="s" x="424" y="346">GPT-6 Sol extracts checks</text>
  <text class="s" x="424" y="364">a person reviews them</text>
  <path class="line" d="M496 300 V 256"/>

  <path class="line" d="M588 184 H 700"/>
  <circle class="flow out" cx="594" cy="184" r="5"/>

  <text class="ea" x="712" y="42">VERDICT PER LIVE CAMPAIGN</text>
  <g class="v1"><rect class="card" x="712" y="62" width="216" height="72" rx="12"/>
    <text class="t" x="728" y="92">Summer Saver</text><text class="s" x="728" y="114">£4.00 label, not £3.50</text>
    <rect x="852" y="80" width="60" height="24" rx="6" fill="rgba(177,31,75,.08)" stroke="rgba(177,31,75,.25)"/><text class="badge" x="866" y="96" fill="#b11f4b">FAIL</text></g>
  <g class="v2"><rect class="card" x="712" y="148" width="216" height="72" rx="12"/>
    <text class="t" x="728" y="178">Hollin 2 for £7</text><text class="s" x="728" y="200">top-shelf close-up missing</text>
    <rect x="844" y="166" width="68" height="24" rx="6" fill="rgba(245,158,11,.12)" stroke="rgba(245,158,11,.4)"/><text class="badge" x="852" y="182" fill="#b45309">REVIEW</text></g>
  <g class="v3"><rect class="soft" x="712" y="234" width="216" height="72" rx="12" stroke-dasharray="4 4"/>
    <text class="t" x="728" y="264">Hazelnut</text><text class="s" x="728" y="286">starts 29 June: not asked</text>
    <rect x="836" y="252" width="76" height="24" rx="6" fill="#f5f5f5" stroke="#dedede"/><text class="badge" x="845" y="268" fill="#6f6f6f">NOT LIVE</text></g>
  <text class="s" x="712" y="336">New campaign: new questions,</text>
  <text class="s" x="712" y="354">same photos, no retraining.</text>
</svg>
